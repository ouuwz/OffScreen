name: Build Offscreen APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate Android platform files
        working-directory: android
        run: flutter create --platforms=android --org com.offscreen.app .
      - name: Configure Android
        working-directory: android
        run: python3 tool/prepare_android.py
      - name: Install packages
        working-directory: android
        run: flutter pub get
      - name: Analyze Dart
        working-directory: android
        run: flutter analyze
      - name: Run tests
        working-directory: android
        run: flutter test
      - name: Build release APK
        working-directory: android
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: offscreen-android-arm64-apk
          path: android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
