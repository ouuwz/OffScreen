name: Build Offscreen Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate Android platform files
        working-directory: android
        run: flutter create --platforms=android --org com.offscreen.app .
      - name: Configure Android
        working-directory: android
        run: python3 tool/prepare_android.py
      - name: Install Flutter packages
        working-directory: android
        run: flutter pub get
      - name: Analyze Dart
        working-directory: android
        run: flutter analyze
      - name: Test Flutter
        working-directory: android
        run: flutter test
      - name: Build ARM64 APK
        working-directory: android
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: offscreen-android-arm64
          path: android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Build web app
        working-directory: web
        run: npm run build
      - name: Zip web bundle
        run: cd web/dist && zip -r ../../offscreen-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: offscreen-web-bundle
          path: offscreen-web.zip
          if-no-files-found: error
  publish:
    runs-on: ubuntu-latest
    needs: [build-android, build-web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offscreen-android-arm64
          path: release-assets/android
      - uses: actions/download-artifact@v4
        with:
          name: offscreen-web-bundle
          path: release-assets/web
      - name: Rename release files
        run: |
          mv release-assets/android/app-release.apk release-assets/offscreen-android-arm64.apk
          mv release-assets/web/offscreen-web.zip release-assets/offscreen-web.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/offscreen-android-arm64.apk
            release-assets/offscreen-web.zip
